name: Poll ClickUp Merge

# Finds ClickUp tasks a human has tagged "for-ai" while sitting "in review" and
# dispatches one clickup-merge run per task, for agent-merge.yml to pick up.
#
# This is the SOLE poller on (status: in review, tag: for-ai) — it replaces what used
# to be poll-clickup-apply-review.yml. That old poller and this one can't coexist: both
# would match the exact same (status, tag) pair, and two independent cron pollers racing
# to dispatch the same ticket is a real double-dispatch risk, not a theoretical one. The
# same human gesture (re-adding for-ai at "in review") now always lands here first;
# agent-merge.yml itself decides — by actually reading the posted review against the
# current diff, since nothing in this pipeline posts a structured approve/request-changes
# signal (agent-review.yml always posts via `gh pr review --comment`) — whether that
# means "apply the review feedback" (it re-dispatches clickup-apply-review to
# agent-implement.yml, unchanged, exactly as the old poller used to do directly) or
# "nothing left to fix, merge it" (it does the actual openspec archive + gh pr merge
# itself). See prompts/merge-triage.md and docs/poc/pipeline-reference.md.
#
# Same shape as poll-clickup-review.yml/the old poll-clickup-apply-review.yml: no
# separate marker field — the dispatch lock lives entirely in agent-merge.yml itself
# (DELETE the for-ai tag, no status PUT — status stays "in review" either way, so no
# other poller's filter needs disambiguating from that).
#
# This workflow never writes to ClickUp — only reads, then dispatches via the GitHub API.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-clickup-merge
  cancel-in-progress: false

permissions: {}

env:
  CLICKUP_LIST_ID: ${{ vars.CLICKUP_LIST_ID }}
  IN_REVIEW_STATUS: 'in review'
  MAX_DISPATCHES: 5

jobs:
  poll:
    name: Poll and dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the target status actually exists
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          http_code=$(curl -sS -o list.json -w '%{http_code}' \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/list/${CLICKUP_LIST_ID}")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp GET list returned HTTP ${http_code}"
            cat list.json
            exit 1
          fi

          # A typo'd status name here would otherwise just return zero tasks, every
          # run, forever — and look perfectly healthy the whole time.
          found=$(jq -r --arg s "$IN_REVIEW_STATUS" '[.statuses[].status] | any(. == $s)' list.json)

          if [ "$found" != "true" ]; then
            echo "::error::\"${IN_REVIEW_STATUS}\" is not among this list's statuses:"
            jq -r '.statuses[].status' list.json
            exit 1
          fi

      - name: Fetch tasks in review
        id: fetch
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          http_code=$(curl -sS -o clickup-tasks.json -w '%{http_code}' \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/list/${CLICKUP_LIST_ID}/task?statuses[]=in%20review&include_closed=false")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp API returned HTTP ${http_code}"
            cat clickup-tasks.json
            exit 1
          fi

          # Requires "for-ai" — see header comment.
          jq '.tasks |= map(select((.tags // []) | map(.name) | any(. == "for-ai")))' \
            clickup-tasks.json > clickup-tasks-filtered.json
          mv clickup-tasks-filtered.json clickup-tasks.json

          matched=$(jq '.tasks | length' clickup-tasks.json)
          echo "Tasks in review (tagged for-ai): ${matched}"
          echo "matched=${matched}" >> "$GITHUB_OUTPUT"

      - name: Exit quietly if nothing to do
        if: steps.fetch.outputs.matched == '0'
        run: echo "No tasks in review tagged for-ai — nothing to dispatch."

      - name: Dispatch agent runs
        if: steps.fetch.outputs.matched != '0'
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          set -euo pipefail

          mapfile -t ids < <(jq -r '.tasks[].id' clickup-tasks.json)
          total=${#ids[@]}

          dispatch_count=$total
          if [ "$dispatch_count" -gt "$MAX_DISPATCHES" ]; then
            dispatch_count=$MAX_DISPATCHES
          fi

          echo "Dispatching ${dispatch_count} of ${total} matched task(s) (cap: ${MAX_DISPATCHES})."

          dispatched=0
          for ((i = 0; i < dispatch_count; i++)); do
            ticket_id="${ids[$i]}"

            # caused_by_run_id + triggered_by feed agent-merge.yml's own run-record
            # emit step. See docs/dashboard-plan.md.
            payload=$(jq -n --arg ticket_id "$ticket_id" \
              --arg caused_by_run_id "${{ github.run_id }}-${{ github.run_attempt }}" \
              '{event_type: "clickup-merge", client_payload: {ticket_id: $ticket_id, caused_by_run_id: $caused_by_run_id, triggered_by: "poller"}}')

            http_code=$(curl -sS -o dispatch-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${DISPATCH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d "$payload")

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::GitHub dispatch API returned HTTP ${http_code} for ticket ${ticket_id}"
              cat dispatch-response.json
              exit 1
            fi

            dispatched=$((dispatched + 1))
            echo "Dispatched clickup-merge for ticket ${ticket_id} (${dispatched}/${dispatch_count})"
          done

          echo "Done: dispatched ${dispatched} of ${total} matched task(s)."
