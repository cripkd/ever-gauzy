name: Agent Intake

# Fires once per clickup-intake dispatch from poll-clickup-intake.yml. Everything that
# touches ClickUp is a plain, deterministic curl call in this workflow — Claude never
# gets ClickUp credentials, a ClickUp tool, or network access. Its only job is prose in,
# prose out: given the ticket's original description and the right DoR template, it
# writes a rewritten description to a file. See prompts/intake-rewrite.md for its exact
# contract.
#
# Flow:
#   1. GET  the task, verbatim-guard: if Original report is already populated, stop.
#   2. PUT  status -> IN SPEC, first thing after the guard passes. This is itself a
#      second guard, cheaper than the first: poll-clickup-intake.yml only ever queries
#      `statuses[]=to%20do`, so a ticket moved out of to do can't be re-dispatched by
#      the next poll cycle while this run is still working it. Immediately after:
#      DELETE the "for-ai" tag — it gates every stage's own dispatch independently, so
#      a human has to re-add it deliberately at "ready for spec" for propose to run
#      automatically too, rather than it just carrying over as a stale leftover.
#   3. POST the original description into Original report, verbatim (bash does the
#      copy, not the model — this is what guarantees "verbatim").
#   4. claude -p, no MCP/Bash/network, Read+Write scoped to an isolated scratch dir
#      containing only original.txt + template.md, writes rewritten.md.
#   5. PUT  the rewritten content back as the task's description.

on:
  repository_dispatch:
    types: [clickup-intake]

concurrency:
  group: agent-intake-${{ github.event.client_payload.ticket_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ORIGINAL_REPORT_FIELD_ID: ${{ vars.ORIGINAL_REPORT_FIELD_ID }}
  BUG_CUSTOM_ITEM_ID: ${{ vars.BUG_CUSTOM_ITEM_ID }}
  TICKET_ID: ${{ github.event.client_payload.ticket_id }}
  IN_SPEC_STATUS: ${{ vars.IN_SPEC_STATUS }}
  # Pinned rather than left to the CLI's built-in default: an unpinned default can
  # change silently (e.g. on a claude-code upgrade) and this pipeline doesn't leave
  # anything else to chance either. Set as a repo variable, same place as the others.
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
  # Both blank here in practice — no workflow_dispatch trigger on this file, only
  # repository_dispatch — but read the same way every other agent does. See
  # docs/dashboard-plan.md.
  CAUSED_BY_RUN_ID: ${{ github.event.client_payload.caused_by_run_id }}
  TRIGGERED_BY: ${{ github.event.client_payload.triggered_by }}

jobs:
  intake:
    name: Rewrite ticket to DoR form
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch the task
        id: fetch
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          # Captured unconditionally, before `set -euo pipefail` even engages — see
          # agent-review.yml's identical line for why.
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

          set -euo pipefail

          http_code=$(curl -sS -o task.json -w '%{http_code}' \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp GET task returned HTTP ${http_code}"
            cat task.json
            exit 1
          fi

          # For the run-record emit step's TICKET_TITLE — same task.json already
          # fetched above, no new API call. Heredoc form, same as
          # agent-propose.yml's identical capture: a title can contain
          # characters $GITHUB_ENV's plain KEY=value form can't handle safely.
          {
            echo "TICKET_TITLE<<TICKET_TITLE_EOF"
            jq -r '.name // ""' task.json
            echo "TICKET_TITLE_EOF"
          } >> "$GITHUB_ENV"

      - name: 'Guard: skip if already processed'
        id: guard
        run: |
          set -euo pipefail

          # Same absent-or-blank check poll-clickup-intake.yml uses before it ever
          # dispatches — re-checked here as defense-in-depth against a double dispatch
          # (e.g. two poll cycles racing, or a manual workflow_dispatch during testing).
          already_processed=$(jq -r --arg fid "$ORIGINAL_REPORT_FIELD_ID" '
            (.custom_fields // []) | map(select(.id == $fid)) | .[0] as $field
            | if ($field == null)
                or (($field | has("value")) | not)
                or ($field.value == null)
                or (($field.value | type) == "string" and ($field.value | test("^\\s*$")))
              then "false" else "true" end
          ' task.json)

          echo "already_processed=${already_processed}" >> "$GITHUB_OUTPUT"

          if [ "$already_processed" = "true" ]; then
            echo "Ticket ${TICKET_ID}: Original report already populated — already-processed."
          fi

      - name: Move task to IN SPEC
        if: steps.guard.outputs.already_processed == 'false'
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          # First thing after the guard passes, deliberately before any other write:
          # this takes the ticket out of `to do`, which is the status
          # poll-clickup-intake.yml polls on — so a concurrent or later poll cycle
          # can no longer re-dispatch it while this run is still working it.
          status="${IN_SPEC_STATUS:-in spec}"
          payload=$(jq -n --arg s "$status" '{status: $s}')

          http_code=$(curl -sS -o status-response.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}" \
            -d "$payload")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp PUT status returned HTTP ${http_code}"
            cat status-response.json
            exit 1
          fi

          echo "Ticket ${TICKET_ID}: moved to \"${status}\"."

          # Consumes the tag now that this gate is passed. "for-ai" gates every stage's
          # own dispatch independently — poll-clickup-propose.yml checks it fresh before
          # the NEXT stage runs — so it has to be re-added deliberately each time a human
          # wants automation to continue, not inherited as a leftover from here. Best
          # effort, not gated on http_code the way the status PUT above is: the lock
          # itself already succeeded by this point.
          tag_remove_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}/tag/for-ai" || true)
          echo "Ticket ${TICKET_ID}: removed \"for-ai\" tag (HTTP ${tag_remove_code})."

      - name: Copy original description into Original report, verbatim
        if: steps.guard.outputs.already_processed == 'false'
        id: original
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          # jq -r on a missing/null description yields the literal string "null", not
          # empty — guard the fallback inside the filter itself, not after.
          jq -r '.description // ""' task.json > original.txt
          jq -r '.custom_item_id // ""' task.json > custom-item-id.txt

          payload=$(jq -n --rawfile v original.txt '{value: $v}')

          http_code=$(curl -sS -o field-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}/field/${ORIGINAL_REPORT_FIELD_ID}" \
            -d "$payload")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp POST custom field returned HTTP ${http_code}"
            cat field-response.json
            exit 1
          fi

          echo "Copied original description into Original report (verbatim, $(wc -c < original.txt) bytes)."

      - name: Select the DoR template
        if: steps.guard.outputs.already_processed == 'false'
        run: |
          set -euo pipefail

          custom_item_id=$(cat custom-item-id.txt)
          if [ "$custom_item_id" = "$BUG_CUSTOM_ITEM_ID" ]; then
            template=docs/poc/templates/dor-bug.md
          else
            template=docs/poc/templates/dor-feature.md
          fi

          echo "Ticket ${TICKET_ID}: custom_item_id=${custom_item_id:-<none>} -> ${template}"
          cp "$template" template.md

      - name: Download attached images
        if: steps.guard.outputs.already_processed == 'false'
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          # Cap at 5 images per ticket — same "misconfiguration can't run wild"
          # discipline as the dispatch cap in poll-clickup-intake.yml.
          mkdir -p images
          jq -r '
            (.attachments // [])
            | map(select((.mimetype // "") | startswith("image/")))
            | .[:5][]
            | [.url, (.extension // "png")] | @tsv
          ' task.json > image-list.tsv

          n=0
          while IFS="$(printf '\t')" read -r url ext; do
            n=$((n + 1))
            curl -sS -o "images/image-${n}.${ext}" \
              -H "Authorization: ${CLICKUP_API_TOKEN}" \
              "$url"
          done < image-list.tsv

          echo "Downloaded ${n} image(s) from ticket ${TICKET_ID}."

      - name: Run the intake-rewrite agent
        if: steps.guard.outputs.already_processed == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          # Isolated scratch dir, NOT the repo checkout: Claude's Read/Write access has
          # nothing else in scope to touch, whatever it's scoped to. No MCP, no Bash, no
          # network tool at all — its only capability is reading these files and
          # writing one back.
          workdir="${RUNNER_TEMP}/agent-intake"
          mkdir -p "$workdir"
          mv original.txt template.md "$workdir/"
          if [ -n "$(ls -A images 2>/dev/null)" ]; then
            mv images/* "$workdir/"
          fi

          prompt="$(cat prompts/intake-rewrite.md)"
          model="${CLAUDE_MODEL:-claude-sonnet-5}"
          echo "Using model: ${model}"

          claude_output="${RUNNER_TEMP}/claude-output.txt"
          (
            cd "$workdir"
            claude -p "$prompt" \
              --model "$model" \
              --allowed-tools "Read,Write" \
              --max-turns 8 \
              --output-format stream-json --verbose
          ) | tee "$claude_output"

          # Already --output-format stream-json (JSONL, one JSON object per line) —
          # unlike the other three agents, no format change was needed here to get
          # cost/session data: the final line of stream-json output is the same
          # terminal "result" object --output-format json returns as its one-shot
          # result, verified locally against a real invocation. `|| true` on both:
          # `tail -1 | jq` failing (e.g. a truncated/empty output) shouldn't abort a
          # script that's about to make a real pass/fail decision based on
          # rewritten.md instead, not on this extraction.
          jq -c '{session_id, model: ((.modelUsage // {}) | keys | last), cost_usd: .total_cost_usd,
                  input_tokens: .usage.input_tokens, output_tokens: .usage.output_tokens,
                  cache_read_tokens: .usage.cache_read_input_tokens,
                  cache_creation_tokens: .usage.cache_creation_input_tokens,
                  num_turns, duration_ms}' <(tail -1 "$claude_output") > "${RUNNER_TEMP}/claude-usage.json" || true

          jq -r '"CLAUDE_SESSION_ID=" + (.session_id // ""),
                 "CLAUDE_MODEL_USED=" + (.model // ""),
                 "CLAUDE_COST_USD=" + ((.cost_usd // "") | tostring),
                 "CLAUDE_INPUT_TOKENS=" + ((.input_tokens // "") | tostring),
                 "CLAUDE_OUTPUT_TOKENS=" + ((.output_tokens // "") | tostring),
                 "CLAUDE_CACHE_READ_TOKENS=" + ((.cache_read_tokens // "") | tostring),
                 "CLAUDE_CACHE_CREATION_TOKENS=" + ((.cache_creation_tokens // "") | tostring),
                 "CLAUDE_NUM_TURNS=" + ((.num_turns // "") | tostring),
                 "CLAUDE_DURATION_MS=" + ((.duration_ms // "") | tostring)' \
            "${RUNNER_TEMP}/claude-usage.json" >> "$GITHUB_ENV" 2>/dev/null || true

          if [ ! -s "$workdir/rewritten.md" ]; then
            echo "::error::rewritten.md was not produced (or is empty) for ticket ${TICKET_ID}"
            exit 1
          fi

          cp "$workdir/rewritten.md" rewritten.md

      - name: Write the rewritten description back
        if: steps.guard.outputs.already_processed == 'false'
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          unknown_line=$(tail -n1 rewritten.md)
          # -E (POSIX extended regex), not \+/\{0,1\}: those are GNU BRE extensions that
          # BSD sed (macOS, used to verify this logic locally) doesn't support.
          unknown_count=$(printf '%s' "$unknown_line" | sed -n -E 's/^UNKNOWN_COUNT: *(-?[0-9]+)$/\1/p')

          if [ -z "$unknown_count" ]; then
            echo "::error::rewritten.md's last line isn't a valid UNKNOWN_COUNT marker: ${unknown_line}"
            exit 1
          fi

          if [ "$unknown_count" = "-1" ]; then
            echo "::error::Ticket ${TICKET_ID}: original description was empty or unintelligible — description left unchanged, needs manual attention."
            exit 1
          fi

          # Description is everything except the trailing UNKNOWN_COUNT line.
          # sed '$d' (POSIX), not `head -n -1`: negative counts are a GNU-only extension.
          sed '$d' rewritten.md > description.txt

          # markdown_content, not description: rewritten.md is real markdown (headings,
          # checklists, bold), and the plain `description` field renders it as literal
          # syntax characters instead of interpreting it. Verified against a live task —
          # markdown_content is what actually gets ClickUp to render it.
          payload=$(jq -n --rawfile v description.txt '{markdown_content: $v}')

          http_code=$(curl -sS -o update-response.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}" \
            -d "$payload")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp PUT task returned HTTP ${http_code}"
            cat update-response.json
            exit 1
          fi

          echo "Ticket ${TICKET_ID}: rewritten (unknown items: ${unknown_count})."

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.guard.outputs.already_processed }}" = "true" ]; then
            echo "Ticket ${TICKET_ID}: already-processed."
            echo "OUTCOME=already-processed" >> "$GITHUB_ENV"
          elif [ "${{ job.status }}" = "success" ]; then
            echo "Ticket ${TICKET_ID}: rewritten."
            echo "OUTCOME=rewritten" >> "$GITHUB_ENV"
          else
            echo "Ticket ${TICKET_ID}: failed."
            echo "OUTCOME=failed" >> "$GITHUB_ENV"
          fi

      - name: Emit run record
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail

          # Status only actually changes for a fresh run past the guard — an
          # already-processed ticket is left exactly as found (this workflow never
          # even reaches the lock step for it).
          status_after="to do"
          if [ "${{ steps.guard.outputs.already_processed }}" = "false" ]; then
            status_after="${IN_SPEC_STATUS:-in spec}"
          fi

          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}" \
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          WORKFLOW="agent-intake" \
          EVENT_TYPE="${{ github.event.action || 'workflow_dispatch' }}" \
          TICKET_ID="${TICKET_ID}" \
          TICKET_TITLE="${TICKET_TITLE:-}" \
          CAUSED_BY_RUN_ID="${CAUSED_BY_RUN_ID:-}" \
          TRIGGERED_BY="${TRIGGERED_BY:-manual}" \
          STARTED_AT="${STARTED_AT:-}" \
          FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          OUTCOME="${OUTCOME:-failed}" \
          CLICKUP_STATUS_BEFORE="to do" \
          CLICKUP_STATUS_AFTER="$status_after" \
          CLAUDE_SESSION_ID="${CLAUDE_SESSION_ID:-}" \
          CLAUDE_MODEL_USED="${CLAUDE_MODEL_USED:-}" \
          CLAUDE_COST_USD="${CLAUDE_COST_USD:-}" \
          CLAUDE_INPUT_TOKENS="${CLAUDE_INPUT_TOKENS:-}" \
          CLAUDE_OUTPUT_TOKENS="${CLAUDE_OUTPUT_TOKENS:-}" \
          CLAUDE_CACHE_READ_TOKENS="${CLAUDE_CACHE_READ_TOKENS:-}" \
          CLAUDE_CACHE_CREATION_TOKENS="${CLAUDE_CACHE_CREATION_TOKENS:-}" \
          CLAUDE_NUM_TURNS="${CLAUDE_NUM_TURNS:-}" \
          CLAUDE_DURATION_MS="${CLAUDE_DURATION_MS:-}" \
            node .github/scripts/record-run.mjs > "${RUNNER_TEMP}/run-record.json"

          cat "${RUNNER_TEMP}/run-record.json"

      - name: Upload run record
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/run-record.json
          retention-days: 90
