name: Poll ClickUp Review

# Finds ClickUp tasks ready for AI code review (status: ready for review) and dispatches
# one clickup-review run per task, for agent-review.yml to pick up.
#
# Same shape as poll-clickup-implement.yml: no separate marker field — the dispatch lock
# lives entirely in agent-review.yml itself. Its first action, before anything else,
# moves the task's status to "in review" (and removes the "for-ai" tag — see
# agent-review.yml's own header comment for why), which takes it out of this poller's own
# statuses[]=ready%20for%20review filter. A ticket can't be re-dispatched once a run has
# claimed it, without this poller needing to know anything about that lock directly.
#
# One extra filter beyond that, client-side after the fetch (ClickUp's own statuses[]
# filter has no tag-inclusion equivalent): requires the "for-ai" tag, same as every other
# poller in this pipeline — a human adds it to hand a ticket to automation at this stage;
# without it, the ticket sits untouched and a human can review it themselves. Checked
# fresh on every poll, not just once, so a ticket can move between manual and automated
# handling at any stage. Unlike poll-clickup-implement.yml, there's no exclusion tag to
# drop here — review has no "blocked" concept of its own; a genuine failure goes through
# agent-review.yml's generic needs-human catch-all, not a revert-and-retag path.
#
# This workflow never writes to ClickUp — only reads, then dispatches via the GitHub API.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-clickup-review
  cancel-in-progress: false

permissions: {}

env:
  CLICKUP_LIST_ID: ${{ vars.CLICKUP_LIST_ID }}
  READY_FOR_REVIEW_STATUS: 'ready for review'
  MAX_DISPATCHES: 5

jobs:
  poll:
    name: Poll and dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the target status actually exists
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          http_code=$(curl -sS -o list.json -w '%{http_code}' \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/list/${CLICKUP_LIST_ID}")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp GET list returned HTTP ${http_code}"
            cat list.json
            exit 1
          fi

          # A typo'd status name here would otherwise just return zero tasks, every
          # run, forever — and look perfectly healthy the whole time.
          found=$(jq -r --arg s "$READY_FOR_REVIEW_STATUS" '[.statuses[].status] | any(. == $s)' list.json)

          if [ "$found" != "true" ]; then
            echo "::error::\"${READY_FOR_REVIEW_STATUS}\" is not among this list's statuses:"
            jq -r '.statuses[].status' list.json
            exit 1
          fi

      - name: Fetch tasks ready for review
        id: fetch
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          http_code=$(curl -sS -o clickup-tasks.json -w '%{http_code}' \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/list/${CLICKUP_LIST_ID}/task?statuses[]=ready%20for%20review&include_closed=false")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp API returned HTTP ${http_code}"
            cat clickup-tasks.json
            exit 1
          fi

          # Requires "for-ai" — see header comment.
          jq '.tasks |= map(select((.tags // []) | map(.name) | any(. == "for-ai")))' \
            clickup-tasks.json > clickup-tasks-filtered.json
          mv clickup-tasks-filtered.json clickup-tasks.json

          matched=$(jq '.tasks | length' clickup-tasks.json)
          echo "Tasks ready for review (tagged for-ai): ${matched}"
          echo "matched=${matched}" >> "$GITHUB_OUTPUT"

      - name: Exit quietly if nothing to do
        if: steps.fetch.outputs.matched == '0'
        run: echo "No tasks ready for review — nothing to dispatch."

      - name: Dispatch agent runs
        if: steps.fetch.outputs.matched != '0'
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          set -euo pipefail

          mapfile -t ids < <(jq -r '.tasks[].id' clickup-tasks.json)
          total=${#ids[@]}

          dispatch_count=$total
          if [ "$dispatch_count" -gt "$MAX_DISPATCHES" ]; then
            dispatch_count=$MAX_DISPATCHES
          fi

          echo "Dispatching ${dispatch_count} of ${total} matched task(s) (cap: ${MAX_DISPATCHES})."

          dispatched=0
          for ((i = 0; i < dispatch_count; i++)); do
            ticket_id="${ids[$i]}"

            payload=$(jq -n --arg ticket_id "$ticket_id" \
              '{event_type: "clickup-review", client_payload: {ticket_id: $ticket_id}}')

            http_code=$(curl -sS -o dispatch-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${DISPATCH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d "$payload")

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::GitHub dispatch API returned HTTP ${http_code} for ticket ${ticket_id}"
              cat dispatch-response.json
              exit 1
            fi

            dispatched=$((dispatched + 1))
            echo "Dispatched clickup-review for ticket ${ticket_id} (${dispatched}/${dispatch_count})"
          done

          echo "Done: dispatched ${dispatched} of ${total} matched task(s)."
