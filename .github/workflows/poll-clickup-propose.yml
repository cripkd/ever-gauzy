name: Poll ClickUp Propose

# Finds ClickUp tasks ready for a spec proposal (status: ready for spec) and dispatches
# one clickup-propose run per task, for agent-propose.yml to pick up.
#
# Unlike poll-clickup-intake.yml, there's no separate marker field to check here — the
# dispatch lock lives entirely in agent-propose.yml itself: its first action, before
# anything else, moves the task's status to "spec proposed", which takes it out of this
# poller's own statuses[]=ready%20for%20spec filter. A ticket simply can't be
# re-dispatched once a run has claimed it, without this poller needing to know anything
# about that lock directly.
#
# This workflow never writes to ClickUp — only reads, then dispatches via the GitHub API.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-clickup-propose
  cancel-in-progress: false

permissions: {}

env:
  CLICKUP_LIST_ID: ${{ vars.CLICKUP_LIST_ID }}
  READY_FOR_SPEC_STATUS: 'ready for spec'
  MAX_DISPATCHES: 5

jobs:
  poll:
    name: Poll and dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the target status actually exists
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          http_code=$(curl -sS -o list.json -w '%{http_code}' \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/list/${CLICKUP_LIST_ID}")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp GET list returned HTTP ${http_code}"
            cat list.json
            exit 1
          fi

          # A typo'd status name here would otherwise just return zero tasks, every
          # run, forever — and look perfectly healthy the whole time.
          found=$(jq -r --arg s "$READY_FOR_SPEC_STATUS" '[.statuses[].status] | any(. == $s)' list.json)

          if [ "$found" != "true" ]; then
            echo "::error::\"${READY_FOR_SPEC_STATUS}\" is not among this list's statuses:"
            jq -r '.statuses[].status' list.json
            exit 1
          fi

      - name: Fetch tasks ready for spec
        id: fetch
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          http_code=$(curl -sS -o clickup-tasks.json -w '%{http_code}' \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/list/${CLICKUP_LIST_ID}/task?statuses[]=ready%20for%20spec&include_closed=false")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp API returned HTTP ${http_code}"
            cat clickup-tasks.json
            exit 1
          fi

          matched=$(jq '.tasks | length' clickup-tasks.json)
          echo "Tasks ready for spec: ${matched}"
          echo "matched=${matched}" >> "$GITHUB_OUTPUT"

      - name: Exit quietly if nothing to do
        if: steps.fetch.outputs.matched == '0'
        run: echo "No tasks ready for spec — nothing to dispatch."

      - name: Dispatch agent runs
        if: steps.fetch.outputs.matched != '0'
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          set -euo pipefail

          mapfile -t ids < <(jq -r '.tasks[].id' clickup-tasks.json)
          total=${#ids[@]}

          dispatch_count=$total
          if [ "$dispatch_count" -gt "$MAX_DISPATCHES" ]; then
            dispatch_count=$MAX_DISPATCHES
          fi

          echo "Dispatching ${dispatch_count} of ${total} matched task(s) (cap: ${MAX_DISPATCHES})."

          dispatched=0
          for ((i = 0; i < dispatch_count; i++)); do
            ticket_id="${ids[$i]}"

            payload=$(jq -n --arg ticket_id "$ticket_id" \
              '{event_type: "clickup-propose", client_payload: {ticket_id: $ticket_id}}')

            http_code=$(curl -sS -o dispatch-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${DISPATCH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d "$payload")

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::GitHub dispatch API returned HTTP ${http_code} for ticket ${ticket_id}"
              cat dispatch-response.json
              exit 1
            fi

            dispatched=$((dispatched + 1))
            echo "Dispatched clickup-propose for ticket ${ticket_id} (${dispatched}/${dispatch_count})"
          done

          echo "Done: dispatched ${dispatched} of ${total} matched task(s)."
