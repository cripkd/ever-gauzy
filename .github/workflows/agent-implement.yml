name: Agent Implement

# Fires once per dispatch from any of three sources, distinguished by MODE (below):
#   - poll-clickup-implement.yml: a fresh ticket, "ready for dev" (MODE=implement)
#   - agent-react-to-e2e.yml: a retry, after a red e2e result on a prior push from this
#     same workflow (MODE=implement, CI_FAILURE set)
#   - agent-merge.yml: a human re-added "for-ai" at "in review"; agent-merge.yml's own
#     triage decided the posted review still has actionable feedback and dispatched
#     this (MODE=apply-review) rather than proceeding straight to archive/merge
# All three execute against the real codebase, on the same poc/<ticket_id> branch and
# draft PR agent-propose.yml created, and push the result. See prompts/implement.md
# (MODE=implement) or prompts/apply-review.md (MODE=apply-review) for Claude's exact
# contract in each case.
#
# Flow:
#   1. PUT status -> in progress. FIRST action, before checkout. Dispatch lock, same
#      reasoning as agent-propose.yml: poll-clickup-implement.yml only ever queries
#      statuses[]=ready%20for%20dev, so a ticket moved out of that status can't be
#      re-dispatched by a later poll cycle. On a retry dispatch the ticket is already at
#      "in progress" — this PUT is then just a harmless, idempotent re-confirmation.
#      Immediately after: DELETE the "for-ai" tag — it gates every stage's own dispatch
#      independently, so a human has to re-add it deliberately at "ready for review" for
#      review to run automatically too, not inherited as a leftover from here.
#   2. Full checkout (fetch-depth: 0), then fetch + check out the EXISTING poc/<ticket_id>
#      branch (unlike propose, this workflow never creates a branch — a ticket can't reach
#      "ready for dev" without having gone through propose first, so the branch and its
#      draft PR must already exist; if the fetch fails, that's a real error). If this
#      dispatch carries ci_failure (a retry), write it to .ci-failure.md here — the actual
#      failure from the last real poc-e2e.yml run against this ticket's prior attempt, for
#      the prompt to read and fix against, instead of guessing blind. If MODE is
#      apply-review, fetch the PR's actual review comments instead (gh pr view --json
#      reviews) and write them to .review-comments.md — fetched fresh from GitHub, not
#      passed through the dispatch payload, so this works the same whether the comments
#      came from agent-review.yml or a human reviewing directly on GitHub. Fails outright
#      if there's nothing there to fetch, rather than run Claude with nothing to act on.
#   3. Install Claude Code and the openspec CLI, then restore node_modules — this workflow
#      DOES touch application code, unlike propose, so (unlike propose) it needs the full
#      dependency tree. Reuses poc-e2e.yml's own restore/archive scripts and exact cache
#      key formula, so a cache poc-e2e.yml already populated is reused here too (this
#      workflow never changes dependencies, so a hit there is a hit here).
#   4. Resolve the one OpenSpec change living on this branch via `openspec list --json` —
#      require exactly one. Write its name to .change-name (git-ignored locally, same
#      .git/info/exclude trick as ticket.md) for the prompt to read.
#   5. Write the ticket's description to ticket.md (git-ignored locally), same pattern as
#      propose — supplementary context; the OpenSpec artifacts are authoritative.
#   6. claude -p, model pinned via CLAUDE_MODEL, --allowed-tools
#      "Read,Write,Edit,Glob,Grep,Bash(openspec:*)" — same scope as propose. Claude
#      implements every task in tasks.md and marks it complete (or fixes the
#      .ci-failure.md failure on a retry); it does not commit, push, run tests, touch the
#      PR, or run openspec archive — the workflow does all of that. Notably absent from
#      --allowed-tools: Plan Mode. There's no human here to approve a plan, and the plan
#      already exists (tasks.md itself, an already-approved artifact) — Claude's job is to
#      execute it, not draft a new one.
#   7. RESULT: blocked -> same shape as agent-propose.yml's insufficient-detail path: push
#      whatever real progress exists (for inspection), revert status back to "ready for
#      dev" (MODE=implement) or "in review" (MODE=apply-review — this ticket already went
#      through review, so a blocked fix attempt belongs back at the human's own decision
#      point, not all the way back to pre-implementation), tag "needs-human" and, only for
#      MODE=implement, "implement-blocked" too (see that step's own comment for why
#      apply-review doesn't need an equivalent), comment with the reason. This is a clean,
#      successful completion of the job (no exit 1) — a blocked run is the agent correctly
#      refusing to guess, not a crash. The "implement-blocked" tag is what keeps the
#      revert-to-"ready for dev" safe: poll-clickup-implement.yml skips any task carrying
#      it, so this ticket won't be immediately re-dispatched into the same blocker on the
#      next poll cycle — it only becomes pollable again once a human removes the tag (both
#      tags must already exist in the ClickUp Space; unlike "needs-human",
#      "implement-blocked" is new and must be created there once, manually, before this
#      workflow's first blocked run).
#      RESULT: implemented -> self-check (nx affected lint/typecheck/build) before pushing;
#      a self-check failure IS treated as a real failure (tag "needs-human", generic
#      catch-all below) — unlike "blocked", the agent believed it was done and wasn't.
#      A clean self-check leads to commit + push — NOT `gh pr ready`. The PR stays in
#      draft: agent-react-to-e2e.yml is what undrafts it, gated on poc-e2e.yml actually
#      coming back green for this exact commit, not just a locally-clean self-check. For
#      MODE=apply-review specifically, "implemented" with nothing actually changed (every
#      review comment was praise, already addressed, or out of scope) is a legitimate,
#      non-error outcome — see the commit step's own comment.
#   8. Any failure from step 2 onward: tag "needs human" + comment with the run URL, same
#      generic catch-all as agent-propose.yml.

on:
  repository_dispatch:
    types: [clickup-implement, clickup-apply-review]
  workflow_dispatch:
    inputs:
      ticket_id:
        description: ClickUp ticket id (for a manual re-run after a blocked/failed run)
        required: true
      mode:
        description: 'implement (default) or apply-review, for a manual re-run'
        required: false
        default: implement

concurrency:
  group: agent-implement-${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
  cancel-in-progress: false

permissions:
  # No pull-requests: write — this job no longer performs any PR operation itself
  # (gh pr ready moved to agent-react-to-e2e.yml, gated on a real green e2e result).
  contents: write

env:
  TICKET_ID: ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
  # 'implement' (fresh ticket or e2e-fix retry, both handled by prompts/implement.md) or
  # 'apply-review' (a human re-added for-ai at "in review", handled by
  # prompts/apply-review.md). Derived from the dispatching event_type, same a || b style
  # as TICKET_ID above — github.event.action carries the event_type for a
  # repository_dispatch run (empty for workflow_dispatch, where inputs.mode covers it).
  MODE: ${{ (github.event.action == 'clickup-apply-review') && 'apply-review' || inputs.mode || 'implement' }}
  # Both optional — only set when agent-react-to-e2e.yml re-dispatches this same event
  # type after a red e2e result. Job-level (not step-local), same as TICKET_ID, so every
  # step that needs them references $CI_FAILURE/$ATTEMPT_NUMBER rather than any step
  # splicing the raw ${{ }} expression into its own script body — CI_FAILURE is parsed
  # CI output (test names, error messages), external content no different in kind from
  # TICKET_ID itself, so it gets the same treatment.
  CI_FAILURE: ${{ github.event.client_payload.ci_failure }}
  ATTEMPT_NUMBER: ${{ github.event.client_payload.attempt_number }}
  # Same repo variable agent-propose.yml and agent-intake.yml already pin this to — an
  # unpinned run defaults to a different model entirely (see agent-propose.yml's own
  # comment on this), which is exactly what this pipeline pins everything against.
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
  # Same filename poc-e2e.yml uses for its own archive/cache — deliberately, so this
  # workflow reuses that workflow's cache entry rather than maintaining a second one.
  NODE_MODULES_ARCHIVE: node-modules.tar.zst
  # Nx Cloud is disabled for this org; without this, any nx invocation hard-fails with
  # "Nx Cloud: Workspace is unable to be authorized. Exiting run." (same as poc-e2e.yml).
  NX_NO_CLOUD: true
  # Blank on a manual workflow_dispatch run — the run-record emit step falls back to
  # "manual" for TRIGGERED_BY in that case. See docs/dashboard-plan.md.
  CAUSED_BY_RUN_ID: ${{ github.event.client_payload.caused_by_run_id }}
  TRIGGERED_BY: ${{ github.event.client_payload.triggered_by }}

jobs:
  implement:
    name: Implement the approved spec for a ticket
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Move task to in progress (dispatch lock)
        id: lock
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          # Captured unconditionally, before `set -euo pipefail` even engages — see
          # agent-review.yml's identical line for why.
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

          set -euo pipefail

          payload=$(jq -n '{status: "in progress"}')

          http_code=$(curl -sS -o "${RUNNER_TEMP}/lock-response.json" -w '%{http_code}' \
            -X PUT \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}" \
            -d "$payload")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp PUT status returned HTTP ${http_code} — could not acquire the dispatch lock, stopping."
            cat "${RUNNER_TEMP}/lock-response.json"
            exit 1
          fi

          echo "Ticket ${TICKET_ID}: moved to \"in progress\"."

          # Consumes the tag now that this gate is passed. "for-ai" gates every stage's
          # own dispatch independently — poll-clickup-review.yml checks it fresh before
          # the NEXT stage runs — so it has to be re-added deliberately at "ready for
          # review" for review to run automatically too, not inherited as a leftover
          # from here. Harmless to also run this on a retry dispatch (CI_FAILURE set):
          # retries bypass poll-clickup-implement.yml's own for-ai check entirely (they're
          # fired directly by agent-react-to-e2e.yml, not via the poller), so there's
          # nothing to protect by skipping it there, and DELETE on an already-removed tag
          # is a harmless no-op. Best effort, not gated on http_code the way the status
          # PUT above is: the lock itself already succeeded by this point.
          tag_remove_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}/tag/for-ai" || true)
          echo "Ticket ${TICKET_ID}: removed \"for-ai\" tag (HTTP ${tag_remove_code})."

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Capture the implement prompt
        # Must happen BEFORE the branch switch below, and land outside the repo checkout
        # (RUNNER_TEMP, not a repo-relative path): the prompt files live on develop (the
        # ref actions/checkout just fetched, for a repository_dispatch run), not
        # necessarily on poc/<ticket_id> — that branch is whatever agent-propose.yml
        # committed at propose-time, which can predate any later addition or edit to
        # either file on develop. `git checkout -B` two steps from now is a full ref
        # switch: it deletes any tracked file the target branch doesn't have. Reading the
        # prompt from a path inside the repo AFTER that switch would silently read
        # whatever (possibly nonexistent, possibly stale) version poc/<ticket_id> happens
        # to carry, instead of the pipeline's actual current contract.
        #
        # Source file picked by MODE; destination path is the same either way, so nothing
        # downstream (the "Run the implement agent" step) needs to know which one it is.
        run: |
          set -euo pipefail

          if [ "$MODE" = "apply-review" ]; then
            source_prompt="prompts/apply-review.md"
          else
            source_prompt="prompts/implement.md"
          fi

          cp "$source_prompt" "${RUNNER_TEMP}/implement-prompt.md"

          # Same reasoning, same fix — confirmed necessary on a real run: the very
          # first pilot of the run-record instrumentation (agent-review.yml) failed
          # with "Cannot find module '.../.github/scripts/record-run.mjs'" because that
          # script is newer than the ticket branch it then tried to run from.
          cp .github/scripts/record-run.mjs "${RUNNER_TEMP}/record-run.mjs"

      - name: Check out the existing implementation branch
        run: |
          set -euo pipefail

          branch="poc/${TICKET_ID}"

          # Unlike agent-propose.yml, this branch is never created here — a ticket can't
          # reach "ready for dev" without already having gone through propose, which
          # creates poc/<ticket_id> and its draft PR. A missing branch means the ticket
          # got moved to "ready for dev" some other way; that's a real problem, not
          # something to silently paper over by creating a fresh empty branch.
          if ! git fetch origin "$branch"; then
            reason="Branch ${branch} does not exist on origin — this ticket reached \"ready for dev\" without ever going through the propose stage (or the branch was deleted since). Nothing to implement against."
            echo "::error::${reason}"
            echo "$reason" > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          git checkout -B "$branch" "origin/$branch"

      - name: Fetch review comments, if this is an apply-review dispatch
        if: env.MODE == 'apply-review'
        env:
          # A new secret usage in this workflow — every other step so far only needs
          # CLICKUP_API_TOKEN/ANTHROPIC_API_KEY. Same DISPATCH_PAT every gh pr call in
          # this pipeline already uses; unverified specifically for a read-only `gh pr
          # view` (the "GITHUB_TOKEN blocked from PR operations" finding was confirmed for
          # writes — create/ready/review — not reconfirmed for this), used regardless per
          # the same reasoning, worth reconfirming on the first real run rather than
          # asserting certainty this doesn't have.
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          set -euo pipefail

          reviews_json=$(gh pr view "poc/${TICKET_ID}" --json reviews -R "${{ github.repository }}")

          # Every review round, not just the latest — a second round should still carry
          # the first round's context. `|| true` + explicit empty check, not relying on
          # jq's own exit code: an empty result here is a real, expected-to-be-caught
          # case (a human re-tagged for-ai without ever leaving a review), not a script
          # bug, and a bare assignment on a `jq | ...` pipeline would abort the step under
          # the externally active `bash -e` before the check below ever ran.
          body=$(echo "$reviews_json" | jq -r '
            [.reviews[] | select(.body != "")]
            | map("### \(.author.login) (\(.state)) — \(.submittedAt)\n\n\(.body)")
            | join("\n\n---\n\n")
          ') || true

          if [ -z "$body" ]; then
            reason="No PR review found on poc/${TICKET_ID} — nothing to apply. (for-ai may have been re-added without leaving a review comment first.)"
            echo "::error::${reason}"
            echo "$reason" > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          printf '%s\n' "$body" > .review-comments.md
          echo ".review-comments.md" >> .git/info/exclude

          echo "Wrote .review-comments.md ($(echo "$reviews_json" | jq '[.reviews[] | select(.body != "")] | length') review(s))."

      - name: Write CI failure context, if this is a retry
        if: env.CI_FAILURE != ''
        run: |
          set -euo pipefail

          printf '%s\n' "$CI_FAILURE" > .ci-failure.md

          # Locally ignored, not via the tracked .gitignore — same reasoning as
          # ticket.md/.change-name: this is per-run derived state, never committed.
          echo ".ci-failure.md" >> .git/info/exclude

          echo "Wrote .ci-failure.md (attempt ${ATTEMPT_NUMBER})"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Claude Code and openspec CLIs
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @fission-ai/openspec

      - name: Restore node_modules archive
        id: node-modules-cache
        uses: actions/cache/restore@v4
        # Same key formula as poc-e2e.yml, deliberately — see the header comment. A miss
        # here just means poc-e2e.yml hasn't run since the lockfile last changed; the
        # fallback bootstrap below still works, just slower (1-3h, per the script itself).
        with:
          path: ${{ env.NODE_MODULES_ARCHIVE }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-modules-${{ hashFiles('yarn.lock', 'package.json', 'patches/**', '.scripts/postinstall.js') }}

      - name: Restore node_modules
        shell: bash
        run: .github/scripts/restore-node-modules.sh

      - name: Archive node_modules
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        shell: bash
        run: .github/scripts/archive-node-modules.sh

      - name: Save node_modules archive
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.NODE_MODULES_ARCHIVE }}
          key: ${{ steps.node-modules-cache.outputs.cache-primary-key }}

      - name: Resolve the OpenSpec change
        run: |
          set -euo pipefail

          list_json="${RUNNER_TEMP}/openspec-list.json"
          if ! openspec list --json > "$list_json" 2> "${RUNNER_TEMP}/openspec-list.err"; then
            reason="openspec list --json failed:
          $(cat "${RUNNER_TEMP}/openspec-list.err")"
            echo "::error::${reason}"
            echo "$reason" > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          count=$(jq '.changes | length' "$list_json")
          if [ "$count" -ne 1 ]; then
            reason="Expected exactly one active OpenSpec change on poc/${TICKET_ID}, found ${count}:
          $(jq -r '.changes[].name' "$list_json")"
            echo "::error::${reason}"
            echo "$reason" > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          change_name=$(jq -r '.changes[0].name' "$list_json")
          echo "Resolved OpenSpec change: ${change_name}"
          echo "$change_name" > .change-name
          echo "SPEC_ID=${change_name}" >> "$GITHUB_ENV"

          # Locally ignored, not via the tracked .gitignore — same reasoning as ticket.md
          # below: this file must never be committed, and it's per-run derived state, not
          # something a human editing the repo needs to see.
          echo ".change-name" >> .git/info/exclude

      - name: Write the ticket to ticket.md
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          task_json="${RUNNER_TEMP}/task.json"

          http_code=$(curl -sS -o "$task_json" -w '%{http_code}' \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}" || true)

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp GET task returned HTTP ${http_code}"
            cat "$task_json"
            {
              echo "ClickUp GET task returned HTTP ${http_code}."
              echo
              cat "$task_json"
            } > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          jq -r '.description // ""' "$task_json" > ticket.md
          echo "ticket.md" >> .git/info/exclude

          # For the run-record emit step's TICKET_TITLE — same task.json already
          # fetched above, no new API call. Heredoc form, same as
          # agent-propose.yml's identical capture: a title can contain
          # characters $GITHUB_ENV's plain KEY=value form can't handle safely.
          {
            echo "TICKET_TITLE<<TICKET_TITLE_EOF"
            jq -r '.name // ""' "$task_json"
            echo "TICKET_TITLE_EOF"
          } >> "$GITHUB_ENV"

      - name: Trust the workspace for Claude Code
        run: |
          set -euo pipefail

          # See agent-propose.yml's identical step for why this exact form is required —
          # Claude Code gates a repo's own .claude/settings.local.json behind a one-time
          # interactive trust dialog with no CLI flag to grant it.
          real_path=$(pwd -P)
          claude_config="${HOME}/.claude.json"

          existing='{}'
          if [ -f "$claude_config" ]; then
            existing=$(cat "$claude_config")
          fi

          printf '%s' "$existing" \
            | jq --arg path "$real_path" '.projects[$path].hasTrustDialogAccepted = true' \
            > "$claude_config"

      - name: Run the implement agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          # From RUNNER_TEMP, not the repo-relative path — see the "Capture the implement
          # prompt" step's comment for why: the repo working tree has since been switched
          # to poc/${TICKET_ID}, which may not carry this file (or the current version of it).
          prompt="$(cat "${RUNNER_TEMP}/implement-prompt.md")"
          output_file="${RUNNER_TEMP}/claude-output.txt"
          model="${CLAUDE_MODEL:-claude-sonnet-5}"
          echo "Using model: ${model}"

          claude_exit=0
          claude -p "$prompt" \
            --model "$model" \
            --output-format json \
            --allowed-tools "Read,Write,Edit,Glob,Grep,Bash(openspec:*)" \
            > "$output_file" 2>&1 || claude_exit=$?

          if [ "$claude_exit" -ne 0 ]; then
            cat "$output_file"
            echo "::error::claude exited with status ${claude_exit}"
            {
              echo "claude exited with status ${claude_exit}."
              echo
              tail -c 2000 "$output_file"
            } > "${RUNNER_TEMP}/failure-reason.txt"

            # Best-effort: capture whatever cost/session data IS available even on
            # a failure — an API-level error (e.g. "credit balance too low")
            # still returns a valid JSON result object with real cost already
            # spent before erroring, confirmed on a real run ($1.33 spent, then
            # failed). Losing that would be exactly the run a cost dashboard most
            # needs to show. `|| true`: $output_file may not be valid JSON at all
            # if claude crashed before producing any output.
            jq -r '"CLAUDE_SESSION_ID=" + (.session_id // ""),
                   "CLAUDE_MODEL_USED=" + ((.modelUsage // {}) | keys | last // ""),
                   "CLAUDE_COST_USD=" + ((.total_cost_usd // "") | tostring),
                   "CLAUDE_INPUT_TOKENS=" + ((.usage.input_tokens // "") | tostring),
                   "CLAUDE_OUTPUT_TOKENS=" + ((.usage.output_tokens // "") | tostring),
                   "CLAUDE_CACHE_READ_TOKENS=" + ((.usage.cache_read_input_tokens // "") | tostring),
                   "CLAUDE_CACHE_CREATION_TOKENS=" + ((.usage.cache_creation_input_tokens // "") | tostring),
                   "CLAUDE_NUM_TURNS=" + ((.num_turns // "") | tostring),
                   "CLAUDE_DURATION_MS=" + ((.duration_ms // "") | tostring)' \
              "$output_file" >> "$GITHUB_ENV" 2>/dev/null || true

            exit "$claude_exit"
          fi

          # --output-format json means $output_file is one JSON object now, not free
          # text — extract .result before any RESULT:/TASKS:-grep runs. Same pattern as
          # agent-review.yml/agent-propose.yml; see docs/dashboard-plan.md's Phase A2.
          result_text="${RUNNER_TEMP}/claude-result.txt"
          jq -r '.result' "$output_file" > "$result_text"
          cat "$result_text"

          jq -c '{session_id, model: ((.modelUsage // {}) | keys | last), cost_usd: .total_cost_usd,
                  input_tokens: .usage.input_tokens, output_tokens: .usage.output_tokens,
                  cache_read_tokens: .usage.cache_read_input_tokens,
                  cache_creation_tokens: .usage.cache_creation_input_tokens,
                  num_turns, duration_ms}' "$output_file" > "${RUNNER_TEMP}/claude-usage.json"

          jq -r '"CLAUDE_SESSION_ID=" + (.session_id // ""),
                 "CLAUDE_MODEL_USED=" + (.model // ""),
                 "CLAUDE_COST_USD=" + ((.cost_usd // "") | tostring),
                 "CLAUDE_INPUT_TOKENS=" + ((.input_tokens // "") | tostring),
                 "CLAUDE_OUTPUT_TOKENS=" + ((.output_tokens // "") | tostring),
                 "CLAUDE_CACHE_READ_TOKENS=" + ((.cache_read_tokens // "") | tostring),
                 "CLAUDE_CACHE_CREATION_TOKENS=" + ((.cache_creation_tokens // "") | tostring),
                 "CLAUDE_NUM_TURNS=" + ((.num_turns // "") | tostring),
                 "CLAUDE_DURATION_MS=" + ((.duration_ms // "") | tostring)' \
            "${RUNNER_TEMP}/claude-usage.json" >> "$GITHUB_ENV"

          # `|| true` on both: under pipefail, `grep | sed` fails the whole pipeline if
          # grep finds no match (no RESULT:/TASKS: line — a real possibility if Claude's
          # final output ever goes off-contract), and a bare assignment on that failure
          # would abort the script right here under the externally active `bash -e` —
          # before EITHER $GITHUB_OUTPUT line is written, discarding an already-parsed
          # result too. Explicit non-empty check below turns that into a specific,
          # diagnosable failure-reason.txt instead of falling through to the generic
          # catch-all's "(no specific reason was captured)" fallback.
          result=$(grep -m1 '^RESULT:' "$result_text" | sed 's/^RESULT: *//') || true
          tasks=$(grep -m1 '^TASKS:' "$result_text" | sed 's/^TASKS: *//') || true

          if [ -z "$result" ]; then
            echo "::error::claude's output has no RESULT: line"
            {
              echo "claude's output has no RESULT: line — cannot determine outcome."
              echo
              tail -c 2000 "$result_text"
            } > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "tasks=${tasks}" >> "$GITHUB_OUTPUT"

      - name: Handle blocked result
        if: steps.agent.outputs.result == 'blocked'
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          # Passed through env and referenced as $TASKS below, not interpolated as
          # ${{ steps.agent.outputs.tasks }} directly inside the script body: that value
          # is parsed out of Claude's own free-text stdout (which is itself downstream of
          # ticket/spec content CLAUDE.md already treats as untrusted input), and GitHub
          # splices a `${{ }}` expression into the script's literal text before bash ever
          # sees it — an unescaped `"` or `$(...)` on the TASKS: line would become
          # executable shell in a job holding contents: write and three API tokens.
          # env: values don't have this problem; they're passed as actual process
          # environment, not spliced into source text.
          TASKS: ${{ steps.agent.outputs.tasks }}
        run: |
          set -uo pipefail

          # "Push for inspection" only means something if something is actually pushed —
          # same insight agent-propose.yml's scope-violation handler documents. Only
          # commits if Claude actually changed something before stopping. The next
          # implement run (once unblocked) checks out this same branch, so any progress
          # made here — including tasks.md's updated checkboxes — carries forward.
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            # `|| echo ...`, not bare: the status revert + tagging + comment below matter
            # more than this WIP push succeeding, and a failure on either bare command
            # here would otherwise abort the whole step right here under the externally
            # active `bash -e` — silently skipping all of that.
            git commit -m "WIP: ${TICKET_ID} — implementation blocked, left for inspection" \
              || echo "::warning::nothing to commit, or commit failed — continuing"
            git push origin "poc/${TICKET_ID}" \
              || echo "::warning::push of WIP progress failed — continuing with status revert and tagging anyway"
          fi

          # Revert target depends on MODE: a fresh implement run reverts to "ready for
          # dev" (same shape as agent-propose.yml reverting insufficient-detail tickets to
          # "in spec"), safe there because the "implement-blocked" tag below keeps
          # poll-clickup-implement.yml from picking it straight back up. An apply-review
          # run reverts to "in review" instead — this ticket already went through review;
          # sending it all the way back to "ready for dev" would skip past that. No
          # equivalent exclusion tag is needed there: "for-ai" was already consumed by
          # agent-merge.yml's own lock before it ever dispatched this run (this run's own
          # lock step removes it again too, harmlessly), so the ticket is already
          # un-pollable by poll-clickup-merge.yml the moment it blocks — a human has to
          # deliberately re-add "for-ai" to retry either way.
          if [ "$MODE" = "apply-review" ]; then
            revert_status="in review"
            action_desc="Applying review feedback"
          else
            revert_status="ready for dev"
            action_desc="Implementation"
          fi

          status_payload=$(jq -n --arg s "$revert_status" '{status: $s}')
          http_code=$(curl -sS -o "${RUNNER_TEMP}/revert-response.json" -w '%{http_code}' \
            -X PUT \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}" \
            -d "$status_payload" || true)

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp PUT status (revert to ${revert_status}) returned HTTP ${http_code}"
            cat "${RUNNER_TEMP}/revert-response.json"
            {
              echo "ClickUp PUT status (revert to ${revert_status}) returned HTTP ${http_code}."
              echo
              cat "${RUNNER_TEMP}/revert-response.json"
            } > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          # Both tags must already exist in the ClickUp Space — this call only attaches
          # them to the task, it does not create them (verified against ClickUp's API
          # docs: task-tag and space-tag are separate endpoints).
          curl -sS -o /dev/null -w 'tag needs-human: %{http_code}\n' \
            -X POST \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}/tag/needs-human" || true

          # implement-blocked exists specifically to stop poll-clickup-implement.yml from
          # immediately re-dispatching into the same blocker — see header comment. Not
          # needed for apply-review (see the revert-target comment above for why).
          if [ "$MODE" != "apply-review" ]; then
            curl -sS -o /dev/null -w 'tag implement-blocked: %{http_code}\n' \
              -X POST \
              -H "Authorization: ${CLICKUP_API_TOKEN}" \
              "https://api.clickup.com/api/v2/task/${TICKET_ID}/tag/implement-blocked" || true
          fi

          # TASKS is only meaningful for MODE=implement — apply-review.md's contract has
          # no TASKS: line (see prompts/apply-review.md), so $TASKS is empty there; the
          # progress fragment is omitted rather than printed as "( tasks done)".
          if [ -n "$TASKS" ]; then
            progress_fragment=" (${TASKS} tasks done)"
          else
            progress_fragment=""
          fi

          comment_text=$(printf '%s blocked%s — reasoning below.\n\n%s' \
            "$action_desc" \
            "$progress_fragment" \
            "$(tail -c 3000 "${RUNNER_TEMP}/claude-output.txt")")

          # comment, via the same markdown-to-clickup-comment.mjs conversion
          # agent-propose.yml's insufficient-detail handler uses — Claude's own output is
          # real markdown, and the comment block array is what actually renders it as
          # such rather than literal syntax characters.
          comment_blocks=$(printf '%s' "$comment_text" | node .github/scripts/markdown-to-clickup-comment.mjs)
          comment_payload=$(jq -n --argjson c "$comment_blocks" '{comment: $c, notify_all: false}')
          http_code=$(curl -sS -o "${RUNNER_TEMP}/comment-response.json" -w '%{http_code}' \
            -X POST \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}/comment" \
            -d "$comment_payload" || true)

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp POST comment returned HTTP ${http_code}"
            cat "${RUNNER_TEMP}/comment-response.json"
            {
              echo "ClickUp POST comment (blocked explanation) returned HTTP ${http_code}."
              echo
              cat "${RUNNER_TEMP}/comment-response.json"
            } > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          echo "Ticket ${TICKET_ID}: ${action_desc,,} blocked — reverted to \"${revert_status}\", tagged, commented."
          {
            echo "OUTCOME=blocked"
            echo "FAILURE_CLASS=blocked-ambiguous"
            echo "CLICKUP_STATUS_AFTER=${revert_status}"
          } >> "$GITHUB_ENV"

      - name: Self-check the implementation (lint, typecheck, build)
        id: selfcheck
        if: steps.agent.outputs.result == 'implemented'
        run: |
          set -uo pipefail

          output_file="${RUNNER_TEMP}/selfcheck-output.txt"

          # Scoped to the projects this ticket's own changed files directly belong to —
          # NOT `nx affected`'s full dependent graph. Verified on a real run: touching one
          # file in packages/core (46 dependent projects) plus one in packages/ui-core (30
          # more) made `nx affected --target=lint,typecheck,build` try to lint and build 74
          # projects in a single pass, which OOM'd outright on a standard GitHub-hosted
          # runner. Regression-catching across the dependent graph already has a home:
          # pipeline-reference.md's stage 5, the accumulated e2e suite ("no separate
          # regression gate — the accumulated suite IS the regression run"). This
          # self-check only needs to confirm what was actually written is clean, not
          # re-derive the whole dependent graph a second time.
          #
          # `build`/`typecheck` stay scoped to the whole owning project (below,
          # unchanged) — narrowing either to individual files would risk hiding a real
          # regression in some OTHER file of the same project that imports what changed
          # and now no longer type-checks against it. `lint`, by contrast, is real trouble
          # at project scope: `nx lint <project>` lints the entire project regardless of
          # what changed, so any change touching a large, pre-existing project (core,
          # ui-core) surfaces that project's whole backlog of pre-existing lint debt as if
          # it were this change's fault — confirmed on a real run: a change that touched
          # nothing but task-create.handler.ts and one new spec file (both themselves
          # lint-clean) still failed self-check on `core`/`ui-core` lint, entirely on
          # pre-existing errors in files like seed-ever.ts this ticket never touched.
          # Lint, unlike build/typecheck, is file-local static analysis with no cross-file
          # implications, so it's safe to scope down: each project's `lint` target is
          # invoked separately below with `--lintFilePatterns` set to only that project's
          # own changed files (verified locally against a real project — `nx run
          # core:lint --lintFilePatterns=<file>` lints exactly that file, not the whole
          # project, still catches a real error when pointed at a file that has one, and
          # accepts multiple `--lintFilePatterns` flags for more than one file).
          #
          # Project resolution: walk up from each changed file to the nearest project.json
          # ancestor, recording "<project>\t<file>" pairs (not just project names) so the
          # per-project lint pass below knows exactly which files belong to which project.
          # A file with no owning project (e.g. anything under openspec/, which resolves
          # only as far as the workspace root's own "ever-gauzy" pseudo-project) is
          # harmless to include — that project defines no lint/typecheck/build target, and
          # nx silently no-ops a target nothing declares (verified locally) rather than
          # failing, same as it already does for the "no project defines typecheck yet"
          # case below.
          base_sha=$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD)
          pairs=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            dir=$(dirname "$file")
            while [ "$dir" != "." ] && [ ! -f "$dir/project.json" ]; do
              dir=$(dirname "$dir")
            done
            if [ -f "$dir/project.json" ]; then
              name=$(jq -r '.name' "$dir/project.json")
              pairs="${pairs}${name}"$'\t'"${file}"$'\n'
            fi
          done < <(git diff --name-only "$base_sha" HEAD)

          # `|| true`: grep -v exits 1 if every line is blank (the no-owning-project edge
          # case, checked explicitly below) — a bare assignment here would otherwise abort
          # the script under the externally active `bash -e` before that check ran.
          projects=$(printf '%s' "$pairs" | cut -f1 | sort -u | grep -v '^$' || true)

          echo "Self-check scoped to: ${projects:-(no owning project found for any changed file — nothing to check)}"

          if [ -z "$projects" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            # typecheck/build: no project in this workspace defines a typecheck target
            # today, but nx silently no-ops a target nothing declares (verified locally)
            # rather than failing — harmless to ask for now, and picks it up
            # automatically the day a project does define it.
            #
            # `|| selfcheck_exit=$?`, not a bare assignment: GitHub Actions runs steps as
            # `bash -e {0}` regardless of this script's own `set` line (see
            # agent-propose.yml's extensive comments on this exact class of bug) — a bare
            # `selfcheck_exit=$?` on the line after a failing command never gets reached,
            # because the command itself already aborted the step under the externally
            # active -e. Same reasoning applies to every nx invocation below.
            # Tracked separately, not as one shared selfcheck_exit, so the failure
            # handler below can tell a build/typecheck failure apart from a lint
            # failure for the run record's failure_class (see docs/dashboard-plan.md).
            build_exit=0
            lint_exit=0
            projects_csv=$(printf '%s' "$projects" | paste -sd, -)
            npx nx run-many --target=typecheck,build --projects="$projects_csv" \
              > "$output_file" 2>&1 || build_exit=$?

            # lint, one project at a time, scoped to only that project's own changed
            # files that still exist at HEAD — a deleted file can't be passed to
            # --lintFilePatterns (ESLint has nothing to read; errorOnUnmatchedPattern
            # defaults to true, which would fail the run on a false, unrelated error). A
            # project whose only changed file(s) were deletions has nothing left to lint;
            # skipped entirely rather than falling back to no --lintFilePatterns at all,
            # which would silently re-expand to the whole project (its schema default is
            # {projectRoot}) — exactly the failure mode this change exists to avoid.
            #
            # Also skips any project that defines no `lint` target at all — unlike
            # `nx run-many`, which silently no-ops a project missing a given target,
            # `nx run <project>:lint` on such a project hard-errors ("Cannot find
            # configuration for task"), confirmed on a real run against this exact
            # workspace: the root `ever-gauzy` pseudo-project (only defines
            # local-registry) and `poc-e2e` (only defines e2e) both blew up this way the
            # first time this was tried, unrelated to any real lint problem.
            #
            # Collected into an array first, then iterated with `for` — NOT a
            # `while read ... done < <(...)` loop directly. Confirmed by reproducing it
            # locally: running `npx nx show project` inside a `while read` loop fed by
            # process substitution silently truncates the loop after a couple of
            # iterations (an stdin-contention artifact between the loop's own read and
            # whatever npx/nx does with fd 0) — the last project(s) in the list were
            # silently never linted at all, no error, nothing in the log to notice. A
            # `for` loop over a pre-built array never touches stdin, so it can't have
            # this problem.
            project_array=()
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              project_array+=("$line")
            done <<< "$projects"

            for project in "${project_array[@]}"; do
              if ! npx nx show project "$project" --json 2>/dev/null \
                    | jq -e 'has("targets") and (.targets | has("lint"))' > /dev/null; then
                echo "Skipping ${project}:lint — this project defines no lint target." >> "$output_file"
                continue
              fi

              file_args=()
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                [ -f "$file" ] || continue
                file_args+=("--lintFilePatterns=${file}")
              done < <(printf '%s' "$pairs" | awk -F'\t' -v p="$project" '$1 == p {print $2}')

              if [ "${#file_args[@]}" -eq 0 ]; then
                echo "Skipping ${project}:lint — its only changed file(s) were deletions." >> "$output_file"
                continue
              fi

              npx nx run "${project}:lint" "${file_args[@]}" \
                >> "$output_file" 2>&1 || lint_exit=$?
            done

            cat "$output_file"

            if [ "$build_exit" -ne 0 ] || [ "$lint_exit" -ne 0 ]; then
              echo "passed=false" >> "$GITHUB_OUTPUT"
              # build_exit takes priority when both failed — matches the order the two
              # checks actually ran in.
              if [ "$build_exit" -ne 0 ]; then
                echo "failure_class=self-check-build" >> "$GITHUB_OUTPUT"
              else
                echo "failure_class=self-check-lint" >> "$GITHUB_OUTPUT"
              fi
              {
                echo "Self-check failed (typecheck/build for ${projects_csv}, or lint for one of its projects, scoped to changed files):"
                echo
                tail -c 3000 "$output_file"
              } > "${RUNNER_TEMP}/failure-reason.txt"
            else
              echo "passed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Handle self-check failure
        if: steps.agent.outputs.result == 'implemented' && steps.selfcheck.outputs.passed == 'false'
        env:
          FAILURE_CLASS: ${{ steps.selfcheck.outputs.failure_class }}
        run: |
          set -uo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "WIP: ${TICKET_ID} — implementation complete but self-check failed, left for inspection"
            git push origin "poc/${TICKET_ID}"
          fi

          # Status is never reverted on this path (unlike "blocked") — CLICKUP_STATUS_AFTER
          # stays whatever the lock set ("in progress"), matching the workflow's own
          # header comment: the agent believed it was done and wasn't, which is treated
          # as a real failure, not undone.
          echo "OUTCOME=self-check-failed" >> "$GITHUB_ENV"
          echo "FAILURE_CLASS=${FAILURE_CLASS}" >> "$GITHUB_ENV"

          exit 1

      - name: Commit and push
        if: steps.agent.outputs.result == 'implemented' && steps.selfcheck.outputs.passed == 'true'
        # Does NOT mark the PR ready for review — that used to happen right here, on
        # nothing more than this self-check (lint/typecheck/build) passing, before the
        # real e2e suite had even run. It's now agent-react-to-e2e.yml's job, gated on
        # poc-e2e.yml actually coming back green for this exact commit: the PR stays in
        # draft until there's real evidence behind "ready for review", not just a
        # locally-clean build.
        #
        # Also deliberately does not clear a leftover "implement-blocked" tag from an
        # earlier blocked run on this same ticket, even on a now-clean success: that
        # tag's removal is the human's own unblock signal (see
        # poll-clickup-implement.yml's header comment), not something this workflow
        # infers from a later run merely completing.
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -uo pipefail

          run_step() {
            local label="$1"
            shift
            local output code
            output=$("$@" 2>&1) && code=0 || code=$?
            if [ "$code" -ne 0 ]; then
              echo "$output"
              {
                echo "${label} failed:"
                echo
                echo "$output"
              } > "${RUNNER_TEMP}/failure-reason.txt"
              exit "$code"
            fi
            echo "$output"
          }

          # MODE=apply-review, and nothing actually changed: a legitimate outcome (see
          # prompts/apply-review.md — praise, already-addressed, or out-of-scope comments
          # need no code change), not the MODE=implement anomaly it would be otherwise
          # (that path always writes at minimum the failing spec file, so an empty diff
          # there means something is genuinely wrong — left to fail below as it already
          # does). `git commit` on a clean tree just fails, which would wrongly trip the
          # generic catch-all; handle it explicitly instead. Nothing was pushed, so
          # there's no new commit for e2e to re-verify — the ticket's last real green
          # result still stands, and it goes straight back to "ready for review" rather
          # than sitting at "in progress" forever with nothing to move it. No `gh pr
          # ready` needed: the PR was already out of draft by the time this ticket
          # reached review.
          if [ "$MODE" = "apply-review" ] && [ -z "$(git status --porcelain)" ]; then
            status_payload=$(jq -n '{status: "ready for review"}')
            http_code=$(curl -sS -o "${RUNNER_TEMP}/noop-status-response.json" -w '%{http_code}' \
              -X PUT \
              -H "Authorization: ${CLICKUP_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.clickup.com/api/v2/task/${TICKET_ID}" \
              -d "$status_payload" || true)

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::ClickUp PUT status (ready for review, no-op apply-review) returned HTTP ${http_code}"
              cat "${RUNNER_TEMP}/noop-status-response.json"
              {
                echo "ClickUp PUT status (ready for review, no-op apply-review) returned HTTP ${http_code}."
                echo
                cat "${RUNNER_TEMP}/noop-status-response.json"
              } > "${RUNNER_TEMP}/failure-reason.txt"
              exit 1
            fi

            comment_text=$(printf 'Review feedback required no code changes — PR unchanged, back to "ready for review".\n\n%s' \
              "$(tail -c 3000 "${RUNNER_TEMP}/claude-output.txt")")
            comment_blocks=$(printf '%s' "$comment_text" | node .github/scripts/markdown-to-clickup-comment.mjs)
            comment_payload=$(jq -n --argjson c "$comment_blocks" '{comment: $c, notify_all: false}')
            curl -sS -o /dev/null -w 'comment: %{http_code}\n' \
              -X POST \
              -H "Authorization: ${CLICKUP_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.clickup.com/api/v2/task/${TICKET_ID}/comment" \
              -d "$comment_payload" || true

            echo "Ticket ${TICKET_ID}: apply-review made no changes — moved straight back to \"ready for review\"."
            echo "OUTCOME=implemented" >> "$GITHUB_ENV"
            echo "CLICKUP_STATUS_AFTER=ready for review" >> "$GITHUB_ENV"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retry runs (CI_FAILURE set) get a distinct, greppable commit prefix —
          # agent-react-to-e2e.yml counts prior occurrences of it on this branch to
          # enforce MAX_E2E_RETRIES, so the exact wording here is load-bearing, not
          # cosmetic. CI_FAILURE always wins if somehow both it and MODE=apply-review were
          # set (can't currently happen — see header comment — but the precedence should
          # still be unambiguous if it ever did).
          if [ -n "$CI_FAILURE" ]; then
            commit_message="Fix e2e failure: ${TICKET_ID} (attempt ${ATTEMPT_NUMBER})"
          elif [ "$MODE" = "apply-review" ]; then
            commit_message="Address review feedback: ${TICKET_ID}"
          else
            commit_message="Implement ${TICKET_ID}"
          fi

          run_step "git add" git add -A
          run_step "git commit" git commit -m "$commit_message"
          run_step "git push" git push origin "poc/${TICKET_ID}"

          echo "Ticket ${TICKET_ID}: pushed. PR stays in draft until agent-react-to-e2e.yml confirms a green e2e run."
          {
            echo "OUTCOME=implemented"
            echo "CLICKUP_STATUS_AFTER=in progress"
            # For the run-record emit step's COMMIT_SHA — lets the dashboard nest the
            # e2e run this push triggers under this run, joined purely by commit. See
            # docs/dashboard-plan.md. Not set on the no-op apply-review path above (it
            # already `exit 0`s before reaching here) — nothing was pushed there, so
            # there's no new commit for an e2e run to ever test.
            echo "COMMIT_SHA=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: On failure after the lock, flag for a human
        if: failure() && steps.lock.outcome == 'success'
        continue-on-error: true
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          reason_file="${RUNNER_TEMP}/failure-reason.txt"

          if [ -f "$reason_file" ]; then
            reason=$(head -c 2500 "$reason_file")
          else
            reason="(no specific reason was captured for this failure — check the run log)"
          fi

          curl -sS -o /dev/null -w 'tag: %{http_code}\n' \
            -X POST \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}/tag/needs-human" || true

          comment_text=$(printf 'Automated implementation failed.\n\n%s\n\nRun: %s' "$reason" "$run_url")

          comment_payload=$(jq -n --arg t "$comment_text" '{comment_text: $t, notify_all: false}')
          curl -sS -o /dev/null -w 'comment: %{http_code}\n' \
            -X POST \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}/comment" \
            -d "$comment_payload" || true

      - name: Emit run record
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail

          outcome="${OUTCOME:-}"
          if [ -z "$outcome" ]; then
            case "${{ job.status }}" in
              success) outcome="success" ;;
              cancelled) outcome="cancelled" ;;
              *) outcome="failed" ;;
            esac
          fi

          # "ready for dev" for a fresh implement/retry dispatch, "in review" for an
          # apply-review dispatch — the status each mode's own poller filters on.
          status_before="ready for dev"
          if [ "$MODE" = "apply-review" ]; then
            status_before="in review"
          fi

          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}" \
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          WORKFLOW="agent-implement" \
          EVENT_TYPE="${{ github.event.action || 'workflow_dispatch' }}" \
          TICKET_ID="${TICKET_ID}" \
          TICKET_TITLE="${TICKET_TITLE:-}" \
          SPEC_ID="${SPEC_ID:-}" \
          COMMIT_SHA="${COMMIT_SHA:-}" \
          MODE="${MODE}" \
          CAUSED_BY_RUN_ID="${CAUSED_BY_RUN_ID:-}" \
          TRIGGERED_BY="${TRIGGERED_BY:-manual}" \
          STARTED_AT="${STARTED_AT:-}" \
          FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          OUTCOME="$outcome" \
          FAILURE_CLASS="${FAILURE_CLASS:-}" \
          CLICKUP_STATUS_BEFORE="$status_before" \
          CLICKUP_STATUS_AFTER="${CLICKUP_STATUS_AFTER:-in progress}" \
          CLAUDE_SESSION_ID="${CLAUDE_SESSION_ID:-}" \
          CLAUDE_MODEL_USED="${CLAUDE_MODEL_USED:-}" \
          CLAUDE_COST_USD="${CLAUDE_COST_USD:-}" \
          CLAUDE_INPUT_TOKENS="${CLAUDE_INPUT_TOKENS:-}" \
          CLAUDE_OUTPUT_TOKENS="${CLAUDE_OUTPUT_TOKENS:-}" \
          CLAUDE_CACHE_READ_TOKENS="${CLAUDE_CACHE_READ_TOKENS:-}" \
          CLAUDE_CACHE_CREATION_TOKENS="${CLAUDE_CACHE_CREATION_TOKENS:-}" \
          CLAUDE_NUM_TURNS="${CLAUDE_NUM_TURNS:-}" \
          CLAUDE_DURATION_MS="${CLAUDE_DURATION_MS:-}" \
            node "${RUNNER_TEMP}/record-run.mjs" > "${RUNNER_TEMP}/run-record.json"

          cat "${RUNNER_TEMP}/run-record.json"

      - name: Upload run record
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/run-record.json
          retention-days: 90
