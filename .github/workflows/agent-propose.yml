name: Agent Propose

# Fires once per clickup-propose dispatch from poll-clickup-propose.yml. Turns one
# ClickUp ticket into an OpenSpec change proposal (proposal.md, spec delta, tasks.md) on
# its own branch, opened as a draft PR for a human to review. Never merges anything
# itself, and never touches application code — see prompts/propose.md for
# Claude's exact contract; it writes openspec/ artifacts only.
#
# Flow:
#   1. PUT status -> spec proposed. FIRST action, before checkout. This is the dispatch
#      lock: poll-clickup-propose.yml only ever queries statuses[]=ready%20for%20spec,
#      so a ticket moved out of that status can't be re-dispatched by a later poll
#      cycle. If this fails, exit immediately — nothing else can safely proceed without
#      knowing the lock was actually acquired. Immediately after: DELETE the "for-ai"
#      tag — it gates every stage's own dispatch independently, so a human has to
#      re-add it deliberately once they approve this proposal and move it to
#      "ready for dev", for implement to run automatically too.
#   2. Full checkout (fetch-depth: 0), create the branch via the GitHub API (atomic —
#      fails with a real error if it already exists, unlike a plain `git push` of an
#      identical commit, which would silently no-op-succeed), check it out. If it
#      already exists, compare it against the default branch first: ahead_by 0 means
#      it's provably empty (a leftover from a run that failed before ever committing —
#      e.g. a missing tool), so it's deleted and recreated rather than permanently
#      blocking every future retry. ahead_by > 0 means real content exists and is left
#      alone, exactly as before.
#   3. Install Claude Code and the openspec CLI — no repo dependency install, propose
#      doesn't touch application code.
#   4. Write the ticket's description to ticket.md at the repo root (git-ignored
#      locally via .git/info/exclude, never the tracked .gitignore — it must never be
#      committed, and touching the tracked .gitignore would itself be a change outside
#      openspec/).
#   5. claude -p, model pinned via CLAUDE_MODEL (same repo variable as intake — an
#      unpinned run defaulted to Opus here for a while, burning real credit on this
#      token-heavy workflow before anyone could see why), --allowed-tools
#      "Read,Write,Edit,Glob,Grep,Bash(openspec:*)", no MCP. Codebase exploration and
#      file changes go through Read/Write/Edit/Glob/Grep —
#      Bash is scoped to openspec:* only, since driving the openspec CLI is the one
#      thing here that genuinely needs a shell (matching this repo's own reference
#      openspec-propose/openspec-apply-change skills, which scope the same way).
#      Verified locally that this narrower scope is actually sufficient, not just
#      theoretically: a full propose run completes correctly with it, independently
#      re-validated. Working directory is the repo root — propose needs to explore the
#      actual codebase, unlike intake's pure text rewrite. Never
#      --dangerously-skip-permissions.
#   6. Verify git status --porcelain touched nothing outside openspec/ — always, before
#      branching on the result. This is a safety check independent of what Claude
#      claims to have done, and applies whether or not the proposal is complete. On a
#      violation, everything (including the offending files) is committed and pushed
#      to the branch before failing — otherwise "leave the branch for inspection" would
#      leave nothing to actually inspect once the runner's filesystem is gone, and this
#      is also what keeps step 2's cleanup from treating it as an empty, safe-to-delete
#      branch on a later retry.
#   7. RESULT: insufficient-detail -> back to "in spec" + a comment explaining why, no
#      PR, no validate gate (an intentionally-incomplete proposal isn't expected to
#      pass one). Otherwise: openspec validate --changes --strict, then commit, push,
#      open a draft PR.
#   8. Any failure from step 2 onward: tag "needs human" + comment with the run URL, so
#      a failed run doesn't just leave the ticket silently sitting in "spec proposed"
#      with nothing to see.

on:
  repository_dispatch:
    types: [clickup-propose]

concurrency:
  group: agent-propose-${{ github.event.client_payload.ticket_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  TICKET_ID: ${{ github.event.client_payload.ticket_id }}
  # Pinned rather than left to the CLI's built-in default: agent-intake.yml already
  # learned this the hard way (an unpinned default is unverifiable from a personal
  # machine and can change silently). This file never got the same fix when it was
  # built afterward — the gap ran every propose invocation on the CLI's default
  # model with no --model flag at all, which turned out to be Opus, not Sonnet, and
  # burned real credit fast on this token-heavy, tool-call-heavy workflow. Same repo
  # variable as intake, so no new setup needed.
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}

jobs:
  propose:
    name: Propose a spec for a ticket
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Move task to spec proposed (dispatch lock)
        id: lock
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          payload=$(jq -n '{status: "spec proposed"}')

          http_code=$(curl -sS -o "${RUNNER_TEMP}/lock-response.json" -w '%{http_code}' \
            -X PUT \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}" \
            -d "$payload")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp PUT status returned HTTP ${http_code} — could not acquire the dispatch lock, stopping."
            cat "${RUNNER_TEMP}/lock-response.json"
            exit 1
          fi

          echo "Ticket ${TICKET_ID}: moved to \"spec proposed\"."

          # Consumes the tag now that this gate is passed. "for-ai" gates every stage's
          # own dispatch independently — poll-clickup-implement.yml checks it fresh
          # before the NEXT stage runs — so it has to be re-added deliberately (once a
          # human approves this proposal and moves it to "ready for dev") for implement
          # to run automatically too, not inherited as a leftover from here. Best effort,
          # not gated on http_code the way the status PUT above is: the lock itself
          # already succeeded by this point.
          tag_remove_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}/tag/for-ai" || true)
          echo "Ticket ${TICKET_ID}: removed \"for-ai\" tag (HTTP ${tag_remove_code})."

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create and check out the proposal branch
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          branch="poc/${TICKET_ID}"
          sha=$(git rev-parse HEAD)
          api="https://api.github.com/repos/${{ github.repository }}"

          create_branch() {
            # || true: makes this function always return 0, so every call site that
            # does `code=$(create_branch)` — a bare assignment, not exempt from the
            # externally-active `bash -e` the way `cmd || fallback` is — can't be
            # killed by a genuine network-level curl failure before it gets to look
            # at the captured status. curl's own -w already writes "000" for that case.
            curl -sS -o "${RUNNER_TEMP}/branch-response.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_API_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/git/refs" \
              -d "$(jq -n --arg ref "refs/heads/${branch}" --arg sha "$sha" '{ref: $ref, sha: $sha}')" \
              || true
          }

          # Retry once on anything that isn't a clean success or the expected "already
          # exists" (422, handled explicitly below). Observed in practice: GITHUB_TOKEN
          # (unlike a real PAT, verified locally against the same repo) can return 403
          # "Resource not accessible by integration" on a ref-creation call with
          # contents: write already granted and confirmed for the run — transient, gone
          # on a second attempt. A genuine permissions/config problem still surfaces
          # after this, just one attempt later.
          create_branch_retrying() {
            local code
            code=$(create_branch)
            if [ "$code" -ge 300 ] && [ "$code" != "422" ]; then
              echo "::warning::branch creation returned HTTP ${code} — retrying once" >&2
              sleep 3
              code=$(create_branch)
            fi
            echo "$code"
          }

          # The git ref-creation API is atomic: 422 if the ref already exists. A plain
          # `git push` of a brand-new local branch would silently succeed even if the
          # branch already exists remotely at this exact commit (a no-op fast-forward,
          # not an error), which would defeat "exit if it already exists" entirely.
          http_code=$(create_branch_retrying)

          if [ "$http_code" -eq 422 ]; then
            # Already exists — but a run that failed before ever committing (e.g. a
            # missing tool, a transient API error) leaves an empty branch behind that
            # would otherwise block every retry forever. ahead_by == 0 means it has no
            # commits of its own beyond the current default branch: provably empty,
            # safe to delete and recreate. ahead_by > 0 means real work exists (either
            # a genuinely in-flight run, or content pushed by the scope-violation check
            # below) — leave it alone and fail loudly, exactly as before.
            ahead_by=$(curl -sS -H "Authorization: Bearer ${GH_API_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/compare/${{ github.event.repository.default_branch }}...${branch}" \
              | jq '.ahead_by' || true)

            if [ "$ahead_by" = "0" ]; then
              echo "poc/${TICKET_ID} exists but is empty (ahead_by 0) — deleting and recreating."
              curl -sS -o /dev/null -w 'delete: %{http_code}\n' \
                -X DELETE \
                -H "Authorization: Bearer ${GH_API_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${api}/git/refs/heads/${branch}"

              # A brief pause before recreating: the 403 above was observed happening
              # right after a delete of the same ref name, which a real PAT didn't
              # reproduce — this and the retry in create_branch_retrying are cheap
              # insurance against whatever timing/identity quirk causes it.
              sleep 2
              http_code=$(create_branch_retrying)
            fi
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            if [ "$http_code" -eq 422 ]; then
              reason="Could not create branch ${branch} (HTTP 422) — it has unmerged work and needs manual attention."
            else
              reason="Could not create branch ${branch} (HTTP ${http_code})."
            fi
            echo "::error::${reason}"
            cat "${RUNNER_TEMP}/branch-response.json"
            {
              echo "$reason"
              echo
              cat "${RUNNER_TEMP}/branch-response.json"
            } > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Claude Code and openspec CLIs
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @fission-ai/openspec

      - name: Write the ticket to ticket.md
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          task_json="${RUNNER_TEMP}/task.json"

          # || true: a bare assignment here would die silently under bash -e (GitHub
          # Actions' always-on shell flag) on a genuine network-level curl failure,
          # before the http_code check below ever runs — same class of bug found and
          # fixed in run_step. curl's own -w already writes "000" on connection
          # failure; || true just stops that from also killing the assignment.
          http_code=$(curl -sS -o "$task_json" -w '%{http_code}' \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}" || true)

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp GET task returned HTTP ${http_code}"
            cat "$task_json"
            {
              echo "ClickUp GET task returned HTTP ${http_code}."
              echo
              cat "$task_json"
            } > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          # Original report is intake's pre-rewrite artifact; propose works from the
          # current (already DoR-rewritten) description only.
          jq -r '.description // ""' "$task_json" > ticket.md

          # Locally ignored, not via the tracked .gitignore: ticket.md must never be
          # committed, and appending to the tracked .gitignore would itself be a change
          # outside openspec/ in the scope check below.
          echo "ticket.md" >> .git/info/exclude

          {
            echo "TICKET_TITLE<<TICKET_TITLE_EOF"
            jq -r '.name' "$task_json"
            echo "TICKET_TITLE_EOF"
          } >> "$GITHUB_ENV"

      - name: Trust the workspace for Claude Code
        run: |
          set -euo pipefail

          # Claude Code gates a repo's own .claude/settings.local.json (checked into
          # this repo, 15 permissions.allow entries) behind a one-time interactive
          # "do you trust this folder" dialog — by design, so cloning a repo can't
          # silently pre-configure an agent's permissions before a human looks at it.
          # There's no CLI flag for this: the only way to grant it is this exact entry
          # in ~/.claude.json, keyed by the resolved real path (no trailing slash,
          # forward slashes — verified against Claude Code's own recorded key format).
          real_path=$(pwd -P)
          claude_config="${HOME}/.claude.json"

          existing='{}'
          if [ -f "$claude_config" ]; then
            existing=$(cat "$claude_config")
          fi

          printf '%s' "$existing" \
            | jq --arg path "$real_path" '.projects[$path].hasTrustDialogAccepted = true' \
            > "$claude_config"

      - name: Run the propose agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          prompt="$(cat prompts/propose.md)"
          output_file="${RUNNER_TEMP}/claude-output.txt"
          model="${CLAUDE_MODEL:-claude-sonnet-5}"
          echo "Using model: ${model}"

          # `|| claude_exit=$?`, not a bare call: under set -e a failing claude would
          # otherwise abort the step on this line, before `cat "$output_file"` below
          # ever runs — meaning a claude crash produced literally zero diagnostic
          # output anywhere, not in the log and not in the reason file. Also 2>&1: was
          # stdout-only, so claude's own error text never reached the log either.
          claude_exit=0
          claude -p "$prompt" \
            --model "$model" \
            --allowed-tools "Read,Write,Edit,Glob,Grep,Bash(openspec:*)" \
            > "$output_file" 2>&1 || claude_exit=$?

          cat "$output_file"

          if [ "$claude_exit" -ne 0 ]; then
            echo "::error::claude exited with status ${claude_exit}"
            {
              echo "claude exited with status ${claude_exit}."
              echo
              tail -c 2000 "$output_file"
            } > "${RUNNER_TEMP}/failure-reason.txt"
            exit "$claude_exit"
          fi

          result=$(grep -m1 '^RESULT:' "$output_file" | sed 's/^RESULT: *//')
          echo "result=${result}" >> "$GITHUB_OUTPUT"

      - name: Verify nothing changed outside openspec/
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # --untracked-files=all: without it, git collapses a brand-new untracked
          # directory (which is exactly what a new openspec change is) into a single
          # line ending in "/", which the proposal_path lookup below can't match against.
          out_of_scope=$(git status --porcelain --untracked-files=all | cut -c4- | grep -v '^openspec/' || true)
          if [ -n "$out_of_scope" ]; then
            echo "::error::Files changed outside openspec/:"
            echo "$out_of_scope"
            {
              echo "Files changed outside openspec/ (pushed to the branch for inspection):"
              echo
              echo "$out_of_scope"
            } > "${RUNNER_TEMP}/failure-reason.txt"

            # "Leave the branch for inspection" only means something if there's
            # actually something pushed to look at — the runner's own filesystem is
            # gone once the job ends. Push everything (including the offending files)
            # so a human can see exactly what happened; this also marks the branch as
            # having real content (ahead_by > 0), so it won't be auto-deleted as stale
            # on a later retry the way an empty branch is.
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Scope violation for ${TICKET_ID} — left for inspection, not opened as a PR"
            git push origin "poc/${TICKET_ID}"

            exit 1
          fi

      - name: Handle insufficient detail
        if: steps.agent.outputs.result == 'insufficient-detail'
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          proposal_path=$(git status --porcelain --untracked-files=all | cut -c4- | grep '/proposal\.md$' | head -n1 || true)
          if [ -n "$proposal_path" ] && [ -f "$proposal_path" ]; then
            comment_source="$proposal_path"
          else
            comment_source="${RUNNER_TEMP}/claude-output.txt"
          fi

          # ClickUp comments have a real size limit; keep this well under it.
          comment_text=$(head -c 3000 "$comment_source")

          status_payload=$(jq -n '{status: "in spec"}')
          http_code=$(curl -sS -o "${RUNNER_TEMP}/revert-response.json" -w '%{http_code}' \
            -X PUT \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}" \
            -d "$status_payload" || true)

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp PUT status (revert to in spec) returned HTTP ${http_code}"
            cat "${RUNNER_TEMP}/revert-response.json"
            {
              echo "ClickUp PUT status (revert to in spec) returned HTTP ${http_code}."
              echo
              cat "${RUNNER_TEMP}/revert-response.json"
            } > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          # comment, not comment_text: comment_source is real markdown (headings,
          # bullets, inline code from proposal.md), and comment_text stores it as
          # literal syntax characters instead of formatting it. Verified against a live
          # task: the comment block array is what actually gets it rendered.
          comment_blocks=$(printf '%s' "$comment_text" | node .github/scripts/markdown-to-clickup-comment.mjs)
          comment_payload=$(jq -n --argjson c "$comment_blocks" '{comment: $c, notify_all: false}')
          http_code=$(curl -sS -o "${RUNNER_TEMP}/comment-response.json" -w '%{http_code}' \
            -X POST \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}/comment" \
            -d "$comment_payload" || true)

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp POST comment returned HTTP ${http_code}"
            cat "${RUNNER_TEMP}/comment-response.json"
            {
              echo "ClickUp POST comment (insufficient-detail explanation) returned HTTP ${http_code}."
              echo
              cat "${RUNNER_TEMP}/comment-response.json"
            } > "${RUNNER_TEMP}/failure-reason.txt"
            exit 1
          fi

          echo "Ticket ${TICKET_ID}: insufficient detail — reverted to \"in spec\", commented, no PR."

      - name: Validate the proposal
        if: steps.agent.outputs.result != 'insufficient-detail'
        run: |
          set -uo pipefail

          # --changes, not just --strict: bare `openspec validate --strict` returns
          # "Nothing to validate" (exit 1) with no target — verified locally, it
          # doesn't default to validating everything. --changes covers it without
          # needing to know Claude's dynamically-chosen change name.
          output_file="${RUNNER_TEMP}/validate-output.txt"
          validate_exit=0
          openspec validate --changes --strict > "$output_file" 2>&1 || validate_exit=$?

          cat "$output_file"

          if [ "$validate_exit" -ne 0 ]; then
            {
              echo "openspec validate --changes --strict failed:"
              echo
              cat "$output_file"
            } > "${RUNNER_TEMP}/failure-reason.txt"
            exit "$validate_exit"
          fi

      - name: Commit, push, and open the draft PR
        if: steps.agent.outputs.result != 'insufficient-detail'
        env:
          # DISPATCH_PAT, not GITHUB_TOKEN, and only for GH_TOKEN (the gh CLI's own
          # auth — git push below still goes through actions/checkout's separately
          # persisted GITHUB_TOKEN credential, unaffected by this, and it already
          # works: two different runs both pushed successfully with it). This repo
          # is a fork of ever-co/ever-gauzy, and forks carry a documented, sometimes
          # non-overridable GitHub-side restriction on GITHUB_TOKEN creating pull
          # requests — confirmed here: default_workflow_permissions is "write" (the
          # repo setting was never the problem) yet gh pr create still failed with
          # "GitHub Actions is not permitted to create or approve pull requests" on
          # a real, diagnosed run. DISPATCH_PAT is a real personal token, already in
          # this repo for triggering repository_dispatch, and isn't subject to that
          # GITHUB_TOKEN-specific gate at all.
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          set -uo pipefail

          # Each command's own name and output go into the reason file only if it's
          # the one that actually failed — `run_step` isolates which command that was,
          # since this chains three commands that can each fail for unrelated reasons
          # (nothing to commit, a push conflict, PR creation permissions).
          run_step() {
            local label="$1"
            shift
            local output code
            # `&& code=0 || code=$?`, not a bare `output=$(...)` followed by
            # `code=$?`: GitHub Actions always runs steps as `bash -e {0}` — that -e
            # is active from OUTSIDE this script regardless of any `set` command
            # inside it, and a bare command-substitution assignment is NOT exempt
            # from it the way `cmd || fallback` is. When gh pr create genuinely
            # failed in production, this bare form killed the step on this exact
            # line — before code=$? or any of the error-handling below ever ran,
            # which is why the first real failure here produced zero diagnostics
            # anywhere. Verified: reproduced the silent death under `bash -e`
            # against a real failing command, then verified this form survives it
            # and correctly reaches the error handling with the right exit code.
            output=$("$@" 2>&1) && code=0 || code=$?
            if [ "$code" -ne 0 ]; then
              echo "$output"
              {
                echo "${label} failed:"
                echo
                echo "$output"
              } > "${RUNNER_TEMP}/failure-reason.txt"
              exit "$code"
            fi
            echo "$output"
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          run_step "git add" git add openspec/
          run_step "git commit" git commit -m "Propose spec for ${TICKET_ID}"
          run_step "git push" git push origin "poc/${TICKET_ID}"

          title="[${TICKET_ID}] ${TICKET_TITLE}"
          body="Proposes a spec for https://app.clickup.com/t/${TICKET_ID}"

          run_step "gh pr create" gh pr create --draft --title "$title" --body "$body" --head "poc/${TICKET_ID}"

      - name: On failure after the lock, flag for a human
        if: failure() && steps.lock.outcome == 'success'
        continue-on-error: true
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          reason_file="${RUNNER_TEMP}/failure-reason.txt"

          # Every explicit failure point in this job writes a specific reason here
          # before exiting. This falls back to a generic message only for something
          # that fails in a way none of those sites anticipated.
          if [ -f "$reason_file" ]; then
            reason=$(head -c 2500 "$reason_file")
          else
            reason="(no specific reason was captured for this failure — check the run log)"
          fi

          # || true on both: this step is best-effort in both directions — tag AND
          # comment should each be attempted regardless of whether the other one
          # succeeds, and a bare failing curl here would otherwise abort the script
          # under bash -e before the second one ever ran.
          curl -sS -o /dev/null -w 'tag: %{http_code}\n' \
            -X POST \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}/tag/needs-human" || true

          comment_text=$(printf 'Automated spec proposal failed.\n\n%s\n\nRun: %s' "$reason" "$run_url")

          comment_payload=$(jq -n --arg t "$comment_text" '{comment_text: $t, notify_all: false}')
          curl -sS -o /dev/null -w 'comment: %{http_code}\n' \
            -X POST \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.clickup.com/api/v2/task/${TICKET_ID}/comment" \
            -d "$comment_payload" || true
