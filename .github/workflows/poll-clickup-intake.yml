name: Poll ClickUp Intake

# Finds ClickUp tasks that still need the DoR-rewrite agent, and dispatches one
# repository_dispatch (clickup-intake) run per task for agent-intake.yml to pick up.
#
# Marker logic: every task in the target list has a custom field, "Original report"
# (id: ORIGINAL_REPORT_FIELD_ID below). An EMPTY value there means the DoR-rewrite
# agent has not run on this task yet — that agent is the thing that populates it, once
# it runs, with the ticket's original, unedited report text (before the DoR rewrite
# overwrote the description). So "field absent or blank" == "needs a run", and the
# agent populating that field on completion is exactly what stops this poller from
# dispatching the same task again next cycle. No other bookkeeping is needed, and
# this workflow never writes anything back to ClickUp itself — it only reads.
#
# Known limitation: this calls the ClickUp list-tasks endpoint once per run, with no
# pagination. Fine for a POC-sized list; a list large enough to paginate would need a
# follow-up here.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-clickup-intake
  cancel-in-progress: false

permissions: {}

env:
  # Sourced from repo variables (Settings > Secrets and variables > Actions > Variables).
  CLICKUP_LIST_ID: ${{ vars.CLICKUP_LIST_ID }}
  ORIGINAL_REPORT_FIELD_ID: ${{ vars.ORIGINAL_REPORT_FIELD_ID }}
  # Hard cap: a misconfigured marker field (e.g. wrong ORIGINAL_REPORT_FIELD_ID) must
  # not be able to fire dozens of agent runs in one poll.
  MAX_DISPATCHES: 5

jobs:
  poll:
    name: Poll and dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch to-do tasks from ClickUp
        id: fetch
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          set -euo pipefail

          http_code=$(curl -sS -o clickup-tasks.json -w '%{http_code}' \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            "https://api.clickup.com/api/v2/list/${CLICKUP_LIST_ID}/task?statuses[]=to%20do&include_closed=false")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::ClickUp API returned HTTP ${http_code}"
            cat clickup-tasks.json
            exit 1
          fi

      - name: Select tasks missing the Original report marker
        id: select
        run: |
          set -euo pipefail

          # A task matches when its custom_fields entry for ORIGINAL_REPORT_FIELD_ID is
          # missing entirely, has no "value" key, has a null value, or has a
          # whitespace-only string value. Anything else counts as "already populated".
          jq -r --arg fid "$ORIGINAL_REPORT_FIELD_ID" '
            .tasks[]
            | . as $task
            | (($task.custom_fields // []) | map(select(.id == $fid)) | .[0]) as $field
            | select(
                ($field == null)
                or (($field | has("value")) | not)
                or ($field.value == null)
                or (($field.value | type) == "string" and ($field.value | test("^\\s*$")))
              )
            | $task.id
          ' clickup-tasks.json > matched-ids.txt

          total_in_list=$(jq '.tasks | length' clickup-tasks.json)
          matched=$(wc -l < matched-ids.txt | tr -d ' ')

          echo "Tasks in list: ${total_in_list}"
          echo "Tasks needing the DoR-rewrite agent: ${matched}"

          echo "matched=${matched}" >> "$GITHUB_OUTPUT"

      - name: Exit quietly if nothing to do
        if: steps.select.outputs.matched == '0'
        run: echo "No tasks need the DoR-rewrite agent — nothing to dispatch."

      - name: Dispatch agent runs
        if: steps.select.outputs.matched != '0'
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          set -euo pipefail

          mapfile -t ids < matched-ids.txt
          total=${#ids[@]}

          dispatch_count=$total
          if [ "$dispatch_count" -gt "$MAX_DISPATCHES" ]; then
            dispatch_count=$MAX_DISPATCHES
          fi

          echo "Dispatching ${dispatch_count} of ${total} matched task(s) (cap: ${MAX_DISPATCHES})."

          dispatched=0
          for ((i = 0; i < dispatch_count; i++)); do
            ticket_id="${ids[$i]}"

            payload=$(jq -n --arg ticket_id "$ticket_id" \
              '{event_type: "clickup-intake", client_payload: {ticket_id: $ticket_id}}')

            http_code=$(curl -sS -o dispatch-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${DISPATCH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d "$payload")

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::GitHub dispatch API returned HTTP ${http_code} for ticket ${ticket_id}"
              cat dispatch-response.json
              exit 1
            fi

            dispatched=$((dispatched + 1))
            echo "Dispatched clickup-intake for ticket ${ticket_id} (${dispatched}/${dispatch_count})"
          done

          echo "Done: dispatched ${dispatched} of ${total} matched task(s)."
